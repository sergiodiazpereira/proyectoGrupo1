<html>

<head>
    <title>Asociaciones</title>
    <link rel="stylesheet" href="css/styleRelative.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;500;700&display=swap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header>
        <span>Asociaciondle - Admin</span>
    </header>
    <nav>
        <h3>Menú Principal</h3>
        <ul>
            <li>
                <a href="./vistaDashboard.html">
                    <button>
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </button>
                </a>
            </li>
            <li>
                <a href="./vistaGestionAsociaciones.html">
                    <button class="paginaSeleccionada">
                        <i class="fa-regular fa-building"></i>
                        <span>Asociaciones</span>
                    </button>
                </a>
            </li>
            <li>
                <a href="./vistaGestionUsuarios.html">
                    <button>
                        <i class="fa-solid fa-users"></i>
                        <span>Usuarios</span>
                    </button>
                </a>
            </li>
            <li>
                <a href="./vistaGestionContribuciones.html">
                    <button>
                        <i class="fa-solid fa-hand-holding-heart"></i>
                        <span>Contribuciones</span>
                    </button>
                </a>
            </li>
        </ul>
        <ul class="ul-inferior">
            <li>
                <a href="./vistaCambiarContraseniaAdmin.html">
                    <button>
                        <i class="fa-solid fa-key"></i>
                        <span>Cambiar contraseña</span>
                    </button>
                </a>
            </li>
            <li>
                <a href="./vistaLogin.html">
                    <button>
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>Cerrar sesión</span>
                    </button>
                </a>
            </li>
        </ul>
    </nav>
    <main>
        <!-- Gestión de Asociaciones -->
        <div id="bloqueGestionAsociaciones">
            <div id="volver">
                <a href="">
                    <button>
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </a>
            </div>
            <div id="tituloSubtitulo">
                <h1>Añadir Asociación</h1>
                <p>Añade los detalles de la asociación.</p>
            </div>
        </div>

        <!-- Formulario Asociaciones-->
        <div id="bloqueFormularioAsociaciones">
            <div id="formulario-head">
                <h2>Detalles de la Asociación</h2>
                <p>Asegurese de que la información sea correcta antes de añadir.</p>
            </div>
            <div id="formulario-main">
                <div id="formAsociacion">

                    <!-- Nombre + Año -->
                    <div class="fila">
                        <div class="campo">
                            <label>Nombre:</label>
                            <input type="text">
                        </div>

                        <div class="campo">
                            <label>Año de fundación:</label>
                            <input type="text">
                        </div>
                    </div>

                    <!-- Dedicada a + Alcance -->
                    <div class="fila">
                        <div class="campo">
                            <label>Dirigida a:</label>
                            <select name="categoria" id="categoriaDedicacion">
                                <option value="1">Personas con discapacidad</option>
                                <option value="2">Refugiados y migrantes</option>
                                <option value="3">Estudiantes y jóvenes</option>
                                <option value="4">Personas de bajos recursos</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label>Alcance Geográfico:</label>
                            <select name="alcanceGeografico" id="alcanceGeografico">
                                <option value="1">Global</option>
                                <option value="2">Continental</option>
                                <option value="3">Nacional</option>
                                <option value="4">Autonómico</option>
                            </select>
                        </div>
                    </div>

                    <!-- Imagen -->
                    <div class="fila">
                        <div class="campo-grande">
                            <label>Imagen:</label>
                            <input type="file">
                        </div>
                    </div>

                    <!-- Pista difícil -->
                    <div class="fila">
                        <div class="campo-grande">
                            <label>Pista Difícil:</label>
                            <textarea></textarea>
                        </div>
                    </div>

                    <!-- Pista media -->
                    <div class="fila">
                        <div class="campo-grande">
                            <label>Pista Media:</label>
                            <textarea></textarea>
                        </div>
                    </div>

                    <!-- Pista fácil -->
                    <div class="fila">
                        <div class="campo-grande">
                            <label>Pista Fácil:</label>
                            <textarea></textarea>
                        </div>
                    </div>

                    <!-- Contribuciones -->
                    <div>
                        <label>Contribuciones:</label>
                        <div id="cuadroContribuciones">
                            <div class="tag"><input type="checkbox" value="Salud">Salud</div>
                            <div class="tag"><input type="checkbox" value="Protección Infantil">Protección Infantil</div>
                            <div class="tag"><input type="checkbox" value="Asistencia Sanitaria">Asistencia sanitaria</div>
                            <div class="tag"><input type="checkbox" value="Conservación">Conservación</div>
                            <div class="tag"><input type="checkbox" value="Activismo">Activismo</div>
                        </div>
                    </div>

                </div>
            </div>
            <div id="formulario-footer">
                <a href="">
                    <button>
                        <i class="fa-solid fa-circle-plus"></i>
                        <span>Añadir</span>
                    </button>
                </a>
            </div>
        </div>
    </main>
</body>

</html>
